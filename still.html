<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Device Remover · still test</title>
    <style>
      html,
      body {
        overflow: auto !important;
        height: auto !important;
      }
      main {
        padding: 16px;
        max-width: 1400px;
      }
      h1 {
        font-size: 14px;
        font-weight: normal;
        color: #fff;
        margin: 0 0 4px;
      }
      p {
        color: #888;
        margin: 0 0 12px;
        max-width: 80ch;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      button,
      .file {
        font: inherit;
        color: #ddd;
        background: #1a1a1a;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #msg {
        color: #9fe;
      }
      #sheet {
        display: block;
        max-width: 100%;
        height: auto;
        background: #111;
      }
      #report {
        color: #9fe;
        background: #111;
        padding: 10px;
        border-radius: 4px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Device Remover · still-image test</h1>
      <p>
        Runs the whole pipeline (detect → mask → every fill) on one frame and times each step. Nothing is uploaded.
        With <code>npm run dev</code>, a webcam capture is also written to <code>captures/</code> in the project folder
        so it can be reused as a test image.
      </p>
      <div class="bar">
        <button id="capture" disabled>Capture from webcam (3 s countdown)</button>
        <label class="file">Open image… <input id="file" type="file" accept="image/*" hidden /></label>
        <button id="save" disabled>Download result sheet</button>
        <span id="msg">loading models…</span>
      </div>
      <canvas id="sheet" width="16" height="16"></canvas>
      <pre id="report"></pre>
    </main>
    <script type="module" src="/src/still.ts"></script>
  </body>
</html>
